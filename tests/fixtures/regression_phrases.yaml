# Контрольные фразы голосовых команд (M3-1 / M3-2, docs/ROADMAP.md).
#
# Каждая фраза проходит через весь роутер (tests/llm/test_regression_phrases.py):
#   tool / args — шаблон выбирает этот инструмент с ровно этими аргументами,
#                 без обращения к модели;
#   speak       — роутер отвечает сам (например, время по-английски);
#   stop        — остановка речи;
#   model       — шаблона быть не должно, фразу решает модель (проверяется дома).
#
# Фразы — так, как их пишет распознавание: числа бывают словами, предлоги
# и знаки препинания на месте. Личных данных здесь нет и быть не должно
# (репозиторий публичный). Новую найденную в живой сессии фразу добавлять
# сюда вместе с исправлением.

