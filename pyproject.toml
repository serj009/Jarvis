[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.0.1"
description = "Local Windows AI voice assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jarvis" }]

# Major versions pinned per SPEC.md § Dependencies.
dependencies = [
  "pydantic>=2,<3",
  "PySide6>=6,<7",
  "openwakeword>=0.6,<1",
  "faster-whisper>=1,<2",
  "silero-vad>=5,<6",
  "piper-tts>=1,<2",
  "sounddevice>=0.4,<1",
  # Direct: TTS output uses scipy.signal.resample_poly for the Piper-rate ->
  # device-native-rate path. Linear interpolation produced audible spectral-
  # imaging distortion when 22050 Hz had to fall back to 48 kHz. (scipy was
  # already pulled in transitively by openwakeword, so install size is flat.)
  "scipy>=1,<2",
  "httpx>=0.27,<1",
  "psutil>=5,<6",
  # Windows-only: screen capture (screenshot, see_screen) and synthetic
  # keystrokes (type_into_active_window). Marked win32 because the Linux
  # install path builds pygetwindow / pyrect / python3-Xlib from source and
  # fails on a bare CI runner. Safe to exclude elsewhere: every call site
  # imports pyautogui lazily inside execute() and already wraps the call in
  # try/except -> ToolResult(success=False), which is the same degradation
  # non-Windows hosts get today from jarvis/platform/windows.py.
  "pyautogui>=0.9,<1; sys_platform == 'win32'",
  "pillow>=10,<12",
  # Global hotkeys. pynput chosen over `keyboard` because the latter
  # requires admin on Windows for media-key hooks — a non-starter for
  # an installer that should "just work" without elevation prompts.
  # See ui/hotkeys.py header for the full rationale.
  # Windows-only for the same reason as pyautogui: HotkeyManager.register_all
  # imports pynput lazily and logs "pynput not installed; hotkeys disabled"
  # rather than raising, so a headless host loads the module fine.
  "pynput>=1.7,<2; sys_platform == 'win32'",
  # Model Context Protocol client (Anthropic's official SDK). Used by
  # jarvis/tools/mcp_client.py to connect to external MCP servers
  # (Trayce, etc.) over Streamable HTTP and adapt their tools into the
  # local ToolRegistry. All MCP connections are best-effort; a missing
  # `mcp` install or unreachable server never blocks startup.
  "mcp>=1,<2",
  # Password vault crypto — REQUIRED, not optional. The vault refuses to
  # operate without these (no silent downgrade to scrypt / a home-grown
  # cipher), so they belong in the base install. Argon2id KDF + AES-256-GCM.
  #   cryptography: Apache-2.0 / BSD, ~4 MB wheel (bundles OpenSSL).
  #   argon2-cffi:  MIT, ~50 KB (+ argon2-cffi-bindings, the C core).
  "argon2-cffi>=21,<24",
  "cryptography>=41,<44",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  # T4.2: Semantic memory search. sentence-transformers pulls torch and
  # knowledge_store reads YAML files (PyYAML is also a transitive dep of
  # transformers, but made explicit here to avoid accidental breakage).
  "pyyaml>=6,<8",
  # transformers; faiss-cpu provides the vector index. Both are optional
  # at runtime — jarvis gracefully falls back to keyword search when they
  # are absent. Placed under [dev] so CI and dev installs get them.
  "sentence-transformers>=2.6,<4",
  "faiss-cpu>=1.7,<2",
  "ruff>=0.5,<1",
  "pyright>=1.1,<2",
  "pyinstaller>=6,<7",
]
aec = [
  "pywebrtc-audio",
]
# Phase 7: Browser automation — optional Selenium + scraping deps.
# Install via: pip install -e ".[browser]"
browser = [
  "selenium>=4,<5",
  "beautifulsoup4>=4,<5",
]
# Password vault crypto moved into the base `dependencies` (it is required,
# not optional). This extra is kept as an empty back-compat alias so existing
# `pip install -e ".[security]"` commands and docs keep working — the crypto
# libs now arrive with the base install regardless.
security = []
# Extra optional tools — QR codes, YouTube subtitles, notifications, etc.
# Install via: pip install -e ".[extras]"
extras = [
  "qrcode>=7,<9",
  "yt-dlp>=2024,<2028",
  "plyer>=2,<3",
  "wmi>=1.5,<2; sys_platform == 'win32'",
  "pygetwindow>=0.0.9,<1; sys_platform == 'win32'",
]
# OCR — Tesseract wrapper for read_screen_text tool.
# Requires the Tesseract binary installed separately.
# Install via: pip install -e ".[ocr]"
ocr = [
  "pytesseract>=0.3,<1",
]
# Online integration plugins (OFF by default) — Google suite + Telegram.
# The plugin modules import these lazily, so the base install stays fully
# local; these are only needed to actually connect a plugin. The dependency-
# gate in Settings blocks enabling a plugin until its package is importable.
# Install via: pip install -e ".[integrations]"
integrations = [
  "google-api-python-client>=2,<3",
  "google-auth-oauthlib>=1,<2",
  "python-telegram-bot>=21,<22",
  "PyGithub>=2,<3",
  "docker>=7,<8",
  "spotipy>=2,<3",
  "discord.py>=2,<3",
  "dropbox>=12,<13",
  "msal>=1,<2",
  "python-gitlab>=4,<5",
  "paho-mqtt>=2,<3",
]

# All optional dependencies combined — for one-step full install.
# Install via: pip install -e ".[all]"
all = [
  "jarvis[dev]",
  "jarvis[embeddings]",
  "jarvis[browser]",
  "jarvis[security]",
  "jarvis[extras]",
  "jarvis[aec]",
  "jarvis[ocr]",
  "jarvis[integrations]",
]

# T4.2: Semantic memory search — optional heavy dependencies.
# Install via: pip install -e ".[embeddings]"
embeddings = [
  "sentence-transformers>=2.6,<4",
  "faiss-cpu>=1.7,<2",
]

# GPU acceleration for STT (faster-whisper / ctranslate2 CUDA backend).
# OPTIONAL — the base install runs STT on CPU. These are the CUDA 12 /
# cuDNN 9 runtime wheels ctranslate2 4.8.2 dlopen's; Windows-only because
# Linux resolves them through the wheels' RPATH and the base install already
# pins nvidia-cublas for linux. Licences are NVIDIA proprietary
# (cuBLAS: NVIDIA Software Licence; cuDNN: NVIDIA cuDNN SLA); wheels are
# large (~300-700 MB each). Install via: pip install -e ".[gpu]"
gpu = [
  # Pinned exactly (==): an extra carries no hash lock, so the version must
  # be fixed. Both are CUDA 12 / cuDNN 9 runtime wheels — the series
  # ctranslate2 4.8.2 requires. Latest available on PyPI (verified 2026-10).
  "nvidia-cublas-cu12==12.9.2.10 ; sys_platform == 'win32'",
  "nvidia-cudnn-cu12==9.27.0.42 ; sys_platform == 'win32'",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `manual` marks tests that operators run by hand for production verification
# (e.g. RSS-drop measurement after SLEEPING). They are skipped by default;
# run with `pytest -m manual` to opt in.
markers = [
  "manual: operator-run verification (RSS drop, Ollama eviction); skipped by default",
  "slow: tests requiring heavy ML model downloads (embedding model); skipped by default",
  "integration: online integration tests (Google/Telegram); require network/credentials",
]
addopts = "-m 'not manual and not slow'"
# Task 6c: silence ONLY pytest_asyncio's own DeprecationWarning (its event-loop
# redefinition notice under asyncio_mode="auto"). Scoped to the pytest_asyncio
# module as the source so genuine DeprecationWarnings from jarvis or any other
# dependency still surface.
filterwarnings = [
  "ignore::DeprecationWarning:pytest_asyncio",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "S110"]
ignore = []

# PySide6/Qt dictate these method and property names (camelCase overrides and
# the QCheckBox-compatible API on the custom toggle widget). They cannot be
# renamed without breaking the Qt contract, so the N8xx naming rules are
# waived for these EXACT names only — not by rule and not by directory.
[tool.ruff.lint.pep8-naming]
ignore-names = [
  "keyPressEvent",
  "mousePressEvent",
  "paintEvent",
  "isChecked",
  "setChecked",
  "thumbPosition",
]

# S110 (`try-except-pass`) is enforced only where a silently-swallowed error
# is most dangerous — security and audio. A repo-wide sweep of the remaining
# except/pass sites is a separate effort, so S110 is ignored elsewhere.
# (BLE001 was considered but not enabled: ~65 legitimate, logged
# `except Exception` handlers in these trees would each need a noqa, which
# is noise rather than a safety gain — see session log, Этап 9.)
[tool.ruff.lint.per-file-ignores]
"jarvis/agents/*" = ["S110"]
"jarvis/browser/*" = ["S110"]
"jarvis/coding/*" = ["S110"]
"jarvis/core/*" = ["S110"]
"jarvis/integrations/*" = ["S110"]
"jarvis/llm/*" = ["S110"]
"jarvis/memory/*" = ["S110"]
"jarvis/platform/*" = ["S110"]
"jarvis/tools/*" = ["S110"]
"jarvis/ui/*" = ["S110"]
"jarvis/vision/*" = ["S110"]
"jarvis/skills/*" = ["S110"]
"jarvis/personal_starter/*" = ["S110"]
"jarvis/app.py" = ["S110"]
"jarvis/__main__.py" = ["S110"]
"tests/*" = ["S110"]

[tool.pyright]
include = ["jarvis", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingImports = "warning"
