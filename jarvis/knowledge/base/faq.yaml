      ru: "Скопируйте knowledge/templates/game_template.yaml, переименуйте (например stalker2.yaml), заполните ачивки/советы/локации, положите в knowledge/shared/. JARVIS загрузит при перезапуске."
      uk: "Скопіюйте knowledge/templates/game_template.yaml, перейменуйте (наприклад stalker2.yaml), заповніть ачівки/поради/локації, покладіть в knowledge/shared/. JARVIS завантажить при перезапуску."
