      ru: "JARVIS безопасен?"
      uk: "JARVIS безпечний?"
    answer:
      en: "Yes. JARVIS asks confirmation before dangerous actions, limits file access to whitelisted folders, and logs everything. It runs without admin rights and cannot access elevated windows."
      ru: "Да. JARVIS спрашивает подтверждение перед опасными действиями, ограничивает файловый доступ белым списком папок, логирует всё. Работает без прав админа и не может трогать окна с повышенными правами."
      uk: "Так. JARVIS запитує підтвердження перед небезпечними діями, обмежує файловий доступ білим списком папок, логує все. Працює без прав адміна і не може чіпати вікна з підвищеними правами."
