    answer:
      en: "JARVIS auto-classifies unknown entities via LLM. If it fails: say 'Wukong is a game' and JARVIS will remember. Or add the game to knowledge/shared/ for structured data."
      ru: "JARVIS автоматически классифицирует неизвестные сущности через LLM. Если не сработало: скажите 'Wukong — это игра' и JARVIS запомнит. Или добавьте игру в knowledge/shared/ для структурированных данных."
      uk: "JARVIS автоматично класифікує невідомі сутності через LLM. Якщо не спрацювало: скажіть 'Wukong — це гра' і JARVIS запам'ятає. Або додайте гру в knowledge/shared/ для структурованих даних."
    tags: ["gaming", "classifier", "memory"]

  - question:
      en: "How do I enable gaming mode manually?"
      ru: "Как включить игровой режим вручную?"
      uk: "Як увімкнути ігровий режим вручну?"
    answer:
      en: "Say 'Gaming mode on'. JARVIS switches LLM to CPU, TTS to Piper, frees GPU. Say 'Gaming mode off' to return to normal. Auto-detection also works via process names in config."
      ru: "Скажите 'Игровой режим включить'. JARVIS переключит LLM на CPU, TTS на Piper, освободит GPU. 'Игровой режим выключить' — обратно. Автоопределение тоже работает по именам процессов в конфиге."
      uk: "Скажіть 'Ігровий режим увімкнути'. JARVIS переключить LLM на CPU, TTS на Piper, звільнить GPU. 'Ігровий режим вимкнути' — назад. Автовизначення теж працює по іменах процесів в конфізі."
    tags: ["gaming", "modes"]

