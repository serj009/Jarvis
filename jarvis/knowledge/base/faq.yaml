      ru: "Почему JARVIS медленно отвечает?"
      uk: "Чому JARVIS повільно відповідає?"
    answer:
      en: "Likely LLM cold start (~3-5 sec after 30 min idle). You'll hear 'One moment, sir' while loading. To reduce: increase OLLAMA_KEEP_ALIVE or use a smaller model."
      ru: "Скорее всего холодный старт LLM (~3-5 сек после 30 мин неактивности). Вы услышите 'Секунду, сэр' пока грузится. Для ускорения: увеличьте OLLAMA_KEEP_ALIVE или используйте меньшую модель."
      uk: "Скоріше за все холодний старт LLM (~3-5 сек після 30 хв неактивності). Ви почуєте 'Секунду, сер' поки вантажиться. Для прискорення: збільшіть OLLAMA_KEEP_ALIVE або використовуйте меншу модель."
    tags: ["performance", "troubleshooting"]

  - question:
