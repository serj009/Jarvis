      uk: "Як використовувати JARVIS для ігор?"
    answer:
      en: "JARVIS can remember achievements, tips, locations for any game. Add a game database (knowledge/shared/), then ask 'How do I get the Explorer achievement?' while playing. Gaming mode frees GPU for the game."
      ru: "JARVIS может запоминать ачивки, советы, локации для любой игры. Добавьте базу игры (knowledge/shared/), потом спрашивайте 'Как получить ачивку Исследователь?' во время игры. Игровой режим освобождает GPU для игры."
      uk: "JARVIS може запам'ятовувати ачівки, поради, локації для будь-якої гри. Додайте базу гри (knowledge/shared/), потім запитуйте 'Як отримати ачівку Дослідник?' під час гри. Ігровий режим звільняє GPU для гри."
    tags: ["gaming", "basics"]

  - question:
      en: "How do I add game achievements?"
      ru: "Как добавить ачивки игры?"
      uk: "Як додати ачівки гри?"
    answer:
      en: "1) Copy knowledge/templates/game_template.yaml. 2) Rename (e.g. stalker2.yaml). 3) Fill achievements section. 4) Put in knowledge/shared/. Or say 'Remember: for Explorer achievement visit all locations in Stalker 2' — JARVIS auto-categorizes to games."
      ru: "1) Скопируйте knowledge/templates/game_template.yaml. 2) Переименуйте (например stalker2.yaml). 3) Заполните секцию achievements. 4) Положите в knowledge/shared/. Или скажите 'Запомни: для ачивки Исследователь посетить все локации в Stalker 2' — JARVIS автоматически отнесёт к играм."
      uk: "1) Скопіюйте knowledge/templates/game_template.yaml. 2) Перейменуйте (наприклад stalker2.yaml). 3) Заповніть секцію achievements. 4) Покладіть в knowledge/shared/. Або скажіть 'Запам'ятай: для ачівки Дослідник відвідати всі локації в Stalker 2' — JARVIS автоматично віднесе до ігор."
    tags: ["gaming", "achievements", "memory"]

  - question:
