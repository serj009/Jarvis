      ru: "Основной конфиг: config/voice_config.yaml. Системный промпт: config/system_prompt.yaml. Список программ: knowledge/base/apps_and_sites.yaml. Все файлы YAML — редактируйте любым текстовым редактором."
      uk: "Основний конфіг: config/voice_config.yaml. Системний промпт: config/system_prompt.yaml. Список програм: knowledge/base/apps_and_sites.yaml. Всі файли YAML — редагуйте будь-яким текстовим редактором."
