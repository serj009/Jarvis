# FAQ — повний довідник J.A.R.V.I.S. (54 питання, 3 мови)
# Для GitHub — доступно всім користувачам
# Категорії: начало, голос, программы, память, производительность,
#            безопасность, настройка, игры, проблемы

faq:

  # ════════════════════════════════════════════════════
  # 🚀 НАЧАЛО РАБОТЫ
  # ════════════════════════════════════════════════════

  - question:
      en: "What can you do? / List of commands"
      ru: "Что ты умеешь? / Список команд"
      uk: "Що ти вмієш? / Список команд"
    answer:
      en: "I can open programs and websites, search the web, remember facts, set timers, tell you system status, and have a conversation. Say 'status' for system info, 'remember [fact]' to save, 'what do you know about [topic]' to search memory. I speak English, Russian and Ukrainian."
      ru: "Я могу открывать программы и сайты, искать в интернете, запоминать факты, ставить таймеры, показывать статус системы и просто разговаривать. Скажите 'статус' для информации о системе, 'запомни [факт]' для сохранения, 'что ты знаешь о [тема]' для поиска в памяти."
      uk: "Я можу відкривати програми та сайти, шукати в інтернеті, запам'ятовувати факти, ставити таймери, показувати стан системи та просто розмовляти. Скажіть 'стан' для інформації, 'запам'ятай [факт]' для збереження, 'що ти знаєш про [тема]' для пошуку."
    tags: ["basics", "commands"]

  - question:
      en: "How do I call / activate JARVIS?"
      ru: "Как тебя позвать / активировать?"
      uk: "Як тебе покликати / активувати?"
    answer:
      en: "Just start speaking — JARVIS listens continuously using voice activity detection (VAD). When it detects speech, it processes your command. No wake word needed by default, though one can be configured."
      ru: "Просто начните говорить — JARVIS слушает постоянно через детектор голосовой активности (VAD). Когда он обнаруживает речь, обрабатывает команду. Кодовое слово по умолчанию не нужно, но его можно настроить."
      uk: "Просто почніть говорити — JARVIS слухає постійно через детектор голосової активності (VAD). Коли він виявляє мовлення, обробляє команду. Кодове слово за замовчуванням не потрібне, але його можна налаштувати."
    tags: ["basics", "activation"]

  - question:
      en: "How do I turn off JARVIS?"
      ru: "Как выключить JARVIS?"
      uk: "Як вимкнути JARVIS?"
    answer:
      en: "Say 'shut down' or 'turn off'. JARVIS will save the current session, backup memory, and say goodbye. You can also close the terminal window or press Ctrl+C."
      ru: "Скажите 'выключись' или 'заверши работу'. JARVIS сохранит текущую сессию, сделает бэкап памяти и попрощается. Также можно закрыть окно терминала или нажать Ctrl+C."
      uk: "Скажіть 'вимкнись' або 'заверши роботу'. JARVIS збереже поточну сесію, зробить бекап пам'яті та попрощається. Також можна закрити вікно терміналу або натиснути Ctrl+C."
    tags: ["basics", "shutdown"]

  - question:
      en: "How do I restart JARVIS?"
      ru: "Как перезапустить JARVIS?"
      uk: "Як перезапустити JARVIS?"
    answer:
      en: "Say 'restart' or close and reopen. All memory is preserved — nothing is lost on restart. If JARVIS is frozen, use Ctrl+C in the terminal, then start again."
      ru: "Скажите 'перезапуск' или закройте и откройте снова. Вся память сохраняется — ничего не теряется при перезапуске. Если JARVIS завис — нажмите Ctrl+C в терминале и запустите снова."
      uk: "Скажіть 'перезапуск' або закрийте та відкрийте знову. Вся пам'ять зберігається — нічого не втрачається. Якщо JARVIS завис — натисніть Ctrl+C в терміналі та запустіть знову."
    tags: ["basics", "restart"]

  - question:
      en: "First launch — what should I do?"
      ru: "Первый запуск — что делать?"
      uk: "Перший запуск — що робити?"
    answer:
      en: "JARVIS will greet you and suggest saying 'status' to check the system. That's it — just start talking. JARVIS learns your preferences over time. No setup wizard needed."
      ru: "JARVIS поприветствует вас и предложит сказать 'статус' для проверки системы. Это всё — просто начните говорить. JARVIS учится вашим предпочтениям со временем. Никакой настройки не нужно."
      uk: "JARVIS привітає вас і запропонує сказати 'стан' для перевірки системи. Це все — просто почніть говорити. JARVIS вчиться вашим уподобанням з часом. Жодних налаштувань не потрібно."
    tags: ["basics", "onboarding"]

  # ════════════════════════════════════════════════════
  # 🗣️ ГОЛОС И ЯЗЫК
  # ════════════════════════════════════════════════════

  - question:
      en: "How do I change the language?"
      ru: "Как сменить язык?"
      uk: "Як змінити мову?"
    answer:
      en: "Say 'Speak English', 'Говори по-русски' or 'Говори українською'. JARVIS switches and remembers until you change again. Say 'auto' for automatic detection."
      ru: "Скажите 'Speak English', 'Говори по-русски' или 'Говори українською'. JARVIS переключится и запомнит. Скажите 'авто' для возврата к автоопределению."
      uk: "Скажіть 'Speak English', 'Говори по-русски' або 'Говори українською'. JARVIS переключиться і запам'ятає. Скажіть 'авто' для автовизначення."
    tags: ["language", "basics"]

  - question:
      en: "Why does JARVIS confuse Ukrainian and Russian?"
      ru: "Почему JARVIS путает украинский и русский?"
      uk: "Чому JARVIS плутає українську та російську?"
    answer:
      en: "Use STT model 'small' for better UA/RU distinction. If confusion persists, manually switch: 'Говори українською'. This locks the language until changed."
      ru: "Используйте STT модель 'small' для лучшего различения. Если путает — переключите вручную: 'Говори українською'. Язык зафиксируется."
      uk: "Використовуйте STT модель 'small' для кращого розрізнення. Якщо плутає — переключіть вручну: 'Говори українською'. Мова зафіксується."
    tags: ["language", "troubleshooting"]

  - question:
      en: "How do I change JARVIS voice?"
      ru: "Как сменить голос JARVIS?"
      uk: "Як змінити голос JARVIS?"
    answer:
      en: "Edit voice_config.yaml — change the Piper model name for each language. Download new voices from HuggingFace (rhasspy/piper-voices). Restart JARVIS to apply."
      ru: "Измените voice_config.yaml — замените имя Piper-модели для каждого языка. Скачайте новые голоса с HuggingFace (rhasspy/piper-voices). Перезапустите JARVIS."
      uk: "Змініть voice_config.yaml — замініть ім'я Piper-моделі для кожної мови. Завантажте нові голоси з HuggingFace (rhasspy/piper-voices). Перезапустіть JARVIS."
    tags: ["voice", "config"]

  - question:
      en: "JARVIS doesn't hear me"
      ru: "JARVIS не слышит меня"
      uk: "JARVIS не чує мене"
    answer:
      en: "Check: 1) Microphone is set as default in Windows Sound settings. 2) Microphone access is allowed for Desktop apps (Settings → Privacy → Microphone). 3) VAD threshold may be too high — lower it in voice_config.yaml. 4) Try speaking louder or closer to the mic."
      ru: "Проверьте: 1) Микрофон установлен по умолчанию в настройках звука Windows. 2) Доступ к микрофону разрешён для Desktop-приложений (Параметры → Конфиденциальность → Микрофон). 3) Порог VAD может быть слишком высоким — понизьте в voice_config.yaml. 4) Попробуйте говорить громче или ближе."
      uk: "Перевірте: 1) Мікрофон встановлено за замовчуванням в налаштуваннях звуку Windows. 2) Доступ до мікрофону дозволено для Desktop-додатків (Параметри → Конфіденційність → Мікрофон). 3) Поріг VAD може бути зависоким — знизьте в voice_config.yaml. 4) Спробуйте говорити голосніше або ближче."
    tags: ["voice", "troubleshooting", "microphone"]

  - question:
      en: "JARVIS recognizes words incorrectly"
      ru: "JARVIS неправильно распознаёт слова"
      uk: "JARVIS неправильно розпізнає слова"
    answer:
      en: "Whisper STT sometimes misrecognizes names (e.g. 'GitHub' → 'BitHub'). Solutions: 1) Add common misrecognitions to a correction list. 2) Speak clearly, avoid background noise. 3) Try model 'small' instead of 'base'. 4) For app names, JARVIS uses fuzzy matching from the apps list."
      ru: "Whisper STT иногда неправильно распознаёт названия (например 'гитхаб' → 'BitHub'). Решения: 1) Добавить частые ошибки в список коррекций. 2) Говорите чётко, избегайте фонового шума. 3) Попробуйте модель 'small' вместо 'base'. 4) Для программ JARVIS использует нечёткий поиск по списку."
      uk: "Whisper STT іноді неправильно розпізнає назви (наприклад 'гітхаб' → 'BitHub'). Рішення: 1) Додати часті помилки до списку корекцій. 2) Говоріть чітко, уникайте фонового шуму. 3) Спробуйте модель 'small' замість 'base'. 4) Для програм JARVIS використовує нечіткий пошук по списку."
    tags: ["voice", "stt", "troubleshooting"]

  - question:
      en: "How do I set up the microphone?"
      ru: "Как настроить микрофон?"
      uk: "Як налаштувати мікрофон?"
    answer:
      en: "Windows Settings → Sound → Input → choose your microphone as default. Then Settings → Privacy → Microphone → allow Desktop apps. For best results use a headset — it prevents JARVIS from hearing its own voice through speakers."
      ru: "Параметры Windows → Звук → Ввод → выберите микрофон по умолчанию. Затем Параметры → Конфиденциальность → Микрофон → разрешить Desktop-приложениям. Для лучших результатов используйте гарнитуру — она не даёт JARVIS слышать свой голос через динамики."
      uk: "Параметри Windows → Звук → Ввід → оберіть мікрофон за замовчуванням. Потім Параметри → Конфіденційність → Мікрофон → дозволити Desktop-додаткам. Для кращих результатів використовуйте гарнітуру — вона не дає JARVIS чути свій голос через динаміки."
    tags: ["voice", "microphone", "setup"]

  - question:
      en: "Can I use JARVIS in text-only mode?"
      ru: "Можно ли отключить голос? (только текст)"
      uk: "Чи можна вимкнути голос? (тільки текст)"
    answer:
      en: "Not yet in the current version. JARVIS is voice-first by design. Text mode is planned for a future update."
      ru: "Пока нет в текущей версии. JARVIS создан как голосовой ассистент. Текстовый режим запланирован в будущем обновлении."
      uk: "Поки ні в поточній версії. JARVIS створений як голосовий асистент. Текстовий режим заплановано в майбутньому оновленні."
    tags: ["voice", "feature"]

  - question:
      en: "Why does JARVIS interrupt itself?"
      ru: "Почему JARVIS перебивает сам себя?"
      uk: "Чому JARVIS перебиває сам себе?"
    answer:
      en: "The microphone picks up JARVIS voice from speakers and STT processes it as a new command. Solutions: 1) Use headphones (best). 2) Half-duplex mode mutes mic during speech (default). 3) AEC (echo cancellation) can be enabled in config."
      ru: "Микрофон ловит голос JARVIS из динамиков и STT обрабатывает его как новую команду. Решения: 1) Используйте наушники (лучший вариант). 2) Half-duplex режим глушит микрофон во время речи (по умолчанию). 3) AEC (эхоподавление) можно включить в конфиге."
      uk: "Мікрофон ловить голос JARVIS з динаміків і STT обробляє його як нову команду. Рішення: 1) Використовуйте навушники (найкращий варіант). 2) Half-duplex режим глушить мікрофон під час мовлення (за замовчуванням). 3) AEC (ехопридушення) можна увімкнути в конфізі."
    tags: ["voice", "aec", "troubleshooting"]

  - question:
      en: "How do I interrupt JARVIS while it's speaking?"
      ru: "Как перебить JARVIS когда он говорит?"
      uk: "Як перебити JARVIS коли він говорить?"
    answer:
      en: "In half-duplex mode: wait for JARVIS to finish, then speak. In AEC/headphone mode: just start talking — JARVIS detects barge-in and stops. Barge-in support depends on your audio setup."
      ru: "В half-duplex режиме: дождитесь пока JARVIS закончит, потом говорите. В AEC/наушниках: просто начните говорить — JARVIS определит перебивание и остановится. Поддержка barge-in зависит от вашей аудио-настройки."
      uk: "В half-duplex режимі: зачекайте поки JARVIS закінчить, потім говоріть. В AEC/навушниках: просто почніть говорити — JARVIS визначить переривання і зупиниться. Підтримка barge-in залежить від вашого аудіо-налаштування."
    tags: ["voice", "barge-in"]

  # ════════════════════════════════════════════════════
  # 💻 ПРОГРАММЫ И САЙТЫ
  # ════════════════════════════════════════════════════

  - question:
      en: "How do I open a program or website?"
      ru: "Как открыть программу или сайт?"
      uk: "Як відкрити програму або сайт?"
    answer:
      en: "Say 'Open [name]' — for example 'Open YouTube', 'Open Steam', 'Open Telegram'. JARVIS knows common apps and sites in all three languages. Say 'відкрий ютуб' or 'открой стим' — it works."
      ru: "Скажите 'Открой [название]' — например 'Открой YouTube', 'Открой Стим', 'Открой Телеграм'. JARVIS знает популярные программы и сайты на всех трёх языках."
      uk: "Скажіть 'Відкрий [назва]' — наприклад 'Відкрий YouTube', 'Відкрий Стім', 'Відкрий Телеграм'. JARVIS знає популярні програми та сайти трьома мовами."
    tags: ["programs", "basics"]

  - question:
      en: "How do I add a new program for JARVIS to open?"
      ru: "Как добавить новую программу?"
      uk: "Як додати нову програму?"
    answer:
      en: "Add it to knowledge/base/apps_and_sites.yaml with aliases in all three languages. JARVIS will recognize it on next restart."
      ru: "Добавьте в knowledge/base/apps_and_sites.yaml с алиасами на трёх языках. JARVIS распознает после перезапуска."
      uk: "Додайте в knowledge/base/apps_and_sites.yaml з аліасами трьома мовами. JARVIS розпізнає після перезапуску."
    tags: ["programs", "config"]

  - question:
      en: "A program won't open"
      ru: "Программа не открывается"
      uk: "Програма не відкривається"
    answer:
      en: "Check: 1) The program is installed. 2) The exe name in apps_and_sites.yaml is correct. 3) Antivirus may be blocking. 4) The program may need admin rights — JARVIS runs without elevation and cannot open elevated apps."
      ru: "Проверьте: 1) Программа установлена. 2) Имя exe в apps_and_sites.yaml правильное. 3) Антивирус может блокировать. 4) Программа может требовать права админа — JARVIS работает без повышения прав и не может открыть такие программы."
      uk: "Перевірте: 1) Програма встановлена. 2) Ім'я exe в apps_and_sites.yaml правильне. 3) Антивірус може блокувати. 4) Програма може потребувати прав адміна — JARVIS працює без підвищення прав і не може відкрити такі програми."
    tags: ["programs", "troubleshooting"]

  - question:
      en: "How do I close a program?"
      ru: "Как закрыть программу?"
      uk: "Як закрити програму?"
    answer:
      en: "Say 'Close [name]' — for example 'Close Chrome'. JARVIS will attempt to close it gracefully. Note: some programs may not close if they have unsaved data or run with admin rights."
      ru: "Скажите 'Закрой [название]' — например 'Закрой Chrome'. JARVIS попробует закрыть корректно. Некоторые программы могут не закрыться если есть несохранённые данные или запущены от админа."
      uk: "Скажіть 'Закрий [назва]' — наприклад 'Закрий Chrome'. JARVIS спробує закрити коректно. Деякі програми можуть не закритися якщо є незбережені дані або запущені від адміна."
    tags: ["programs", "basics"]

  - question:
      en: "How do I play music?"
      ru: "Как включить музыку?"
      uk: "Як увімкнути музику?"
    answer:
      en: "Say 'Play [song/artist] on YouTube' or 'Play [query]'. JARVIS will open YouTube/YouTube Music with your query. Spotify support depends on whether the app is installed."
      ru: "Скажите 'Включи [песня/артист] на YouTube' или 'Включи [запрос]'. JARVIS откроет YouTube/YouTube Music с вашим запросом. Поддержка Spotify зависит от того, установлено ли приложение."
      uk: "Скажіть 'Увімкни [пісня/артист] на YouTube' або 'Увімкни [запит]'. JARVIS відкриє YouTube/YouTube Music з вашим запитом. Підтримка Spotify залежить від того, чи встановлено додаток."
    tags: ["programs", "music", "entertainment"]

  - question:
      en: "How do I search the web?"
      ru: "Как искать в интернете?"
      uk: "Як шукати в інтернеті?"
    answer:
      en: "Say 'Search for [query]', 'Google [query]', or 'Find [query] on the web'. JARVIS will open a browser with search results. Requires internet connection."
      ru: "Скажите 'Найди в интернете [запрос]', 'Загугли [запрос]' или 'Поищи [запрос]'. JARVIS откроет браузер с результатами поиска. Требуется интернет."
      uk: "Скажіть 'Знайди в інтернеті [запит]', 'Загугли [запит]' або 'Пошукай [запит]'. JARVIS відкриє браузер з результатами пошуку. Потрібен інтернет."
    tags: ["programs", "search", "web"]

  # ════════════════════════════════════════════════════
  # 🧠 ПАМЯТЬ
  # ════════════════════════════════════════════════════

  - question:
      en: "How does JARVIS memory work?"
      ru: "Как работает память JARVIS?"
      uk: "Як працює пам'ять JARVIS?"
    answer:
      en: "JARVIS has three memory levels: 1) Knowledge (shared, comes with JARVIS) — FAQ, commands, game guides. 2) Personal memory (private, only on your PC) — your facts, preferences, projects. 3) Conversation history — all dialogues, searchable. Everything is in local SQLite databases."
      ru: "У JARVIS три уровня памяти: 1) Знания (общие, идут с JARVIS) — FAQ, команды, гайды. 2) Личная память (приватная, только на вашем ПК) — ваши факты, предпочтения, проекты. 3) История диалогов — все разговоры, с поиском. Всё хранится в локальных SQLite базах."
      uk: "У JARVIS три рівні пам'яті: 1) Знання (спільні, йдуть з JARVIS) — FAQ, команди, гайди. 2) Особиста пам'ять (приватна, тільки на вашому ПК) — ваші факти, уподобання, проекти. 3) Історія діалогів — всі розмови, з пошуком. Все зберігається в локальних SQLite базах."
    tags: ["memory", "basics"]

  - question:
      en: "How do I save a fact?"
      ru: "Как запомнить факт?"
      uk: "Як запам'ятати факт?"
    answer:
      en: "Say 'Remember: [fact]' — for example 'Remember: the Explorer achievement requires visiting all locations'. JARVIS auto-tags and categorizes it."
      ru: "Скажите 'Запомни: [факт]' — например 'Запомни: для ачивки Исследователь нужно посетить все локации'. JARVIS автоматически проставит теги и категорию."
      uk: "Скажіть 'Запам'ятай: [факт]' — наприклад 'Запам'ятай: для ачівки Дослідник потрібно відвідати всі локації'. JARVIS автоматично проставить теги та категорію."
    tags: ["memory", "basics"]

  - question:
      en: "How do I find what JARVIS remembers?"
      ru: "Как найти что JARVIS запомнил?"
      uk: "Як знайти що JARVIS запам'ятав?"
    answer:
      en: "Say 'What do you know about [topic]?' — JARVIS searches across all memory levels using keywords and semantic similarity."
      ru: "Скажите 'Что ты знаешь о [тема]?' — JARVIS ищет по всем уровням памяти по ключевым словам и смысловому сходству."
      uk: "Скажіть 'Що ти знаєш про [тема]?' — JARVIS шукає по всіх рівнях пам'яті за ключовими словами та смисловою схожістю."
    tags: ["memory", "search"]

  - question:
      en: "How do I delete a fact from memory?"
      ru: "Как удалить факт из памяти?"
      uk: "Як видалити факт з пам'яті?"
    answer:
      en: "Say 'Forget about [topic]' or 'Delete from memory: [fact]'. JARVIS will ask for confirmation before deleting. Permanent facts require explicit override."
      ru: "Скажите 'Забудь о [тема]' или 'Удали из памяти: [факт]'. JARVIS попросит подтверждение перед удалением. Постоянные факты требуют явного подтверждения."
      uk: "Скажіть 'Забудь про [тема]' або 'Видали з пам'яті: [факт]'. JARVIS попросить підтвердження перед видаленням. Постійні факти потребують явного підтвердження."
    tags: ["memory", "delete"]

  - question:
      en: "Where is my data stored?"
      ru: "Где хранятся мои данные?"
      uk: "Де зберігаються мої дані?"
    answer:
      en: "All data is stored locally on your PC in the memory/ folder. Personal facts in memory/stores/*.db, conversations in memory/conversations/. Nothing is sent to the internet. The memory/ folder is in .gitignore — it won't be uploaded to GitHub."
      ru: "Все данные хранятся локально на вашем ПК в папке memory/. Личные факты в memory/stores/*.db, диалоги в memory/conversations/. Ничего не отправляется в интернет. Папка memory/ в .gitignore — не попадёт на GitHub."
      uk: "Всі дані зберігаються локально на вашому ПК в папці memory/. Особисті факти в memory/stores/*.db, діалоги в memory/conversations/. Нічого не надсилається в інтернет. Папка memory/ в .gitignore — не потрапить на GitHub."
    tags: ["memory", "privacy", "storage"]

  - question:
      en: "How do I backup memory?"
      ru: "Как сделать бэкап памяти?"
      uk: "Як зробити бекап пам'яті?"
    answer:
      en: "JARVIS auto-backups personal.db on shutdown. Manual backup: say 'backup memory' or copy the memory/ folder. Restore: replace memory/ with backup copy and restart."
      ru: "JARVIS автоматически бэкапит personal.db при выключении. Ручной бэкап: скажите 'бэкап памяти' или скопируйте папку memory/. Восстановление: замените memory/ копией и перезапустите."
      uk: "JARVIS автоматично бекапить personal.db при вимкненні. Ручний бекап: скажіть 'бекап пам'яті' або скопіюйте папку memory/. Відновлення: замініть memory/ копією та перезапустіть."
    tags: ["memory", "backup"]

  - question:
      en: "Does memory affect performance?"
      ru: "Память влияет на скорость?"
      uk: "Пам'ять впливає на швидкість?"
    answer:
      en: "No, with our architecture. Memory is split into shards (separate databases per topic). Search is fast even with 100K facts (~50ms). Caching makes repeated queries instant. Only very large databases (1M+ facts) might slow down, but auto-cleanup prevents this."
      ru: "Нет, с нашей архитектурой. Память разделена на шарды (отдельные базы по темам). Поиск быстрый даже при 100K фактов (~50мс). Кэширование делает повторные запросы мгновенными. Только очень большие базы (1М+ фактов) могут замедлить, но автоочистка предотвращает это."
      uk: "Ні, з нашою архітектурою. Пам'ять розділена на шарди (окремі бази по темах). Пошук швидкий навіть при 100K фактів (~50мс). Кешування робить повторні запити миттєвими. Тільки дуже великі бази (1М+ фактів) можуть сповільнити, але автоочистка запобігає цьому."
    tags: ["memory", "performance"]

