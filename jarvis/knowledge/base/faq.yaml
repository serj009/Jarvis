      ru: "В voice_config.yaml → modes.gaming → detect_by_process: добавьте имя exe вашей игры. Или скажите 'Игровой режим включить' для ручной активации, 'Игровой режим выключить' для деактивации."
      uk: "В voice_config.yaml → modes.gaming → detect_by_process: додайте ім'я exe вашої гри. Або скажіть 'Ігровий режим увімкнути' для ручної активації, 'Ігровий режим вимкнути' для деактивації."
    tags: ["config", "gaming"]

