      ru: "Как изменить формат времени?"
      uk: "Як змінити формат часу?"
    answer:
      en: "Default: 24h for RU/UK, 12h for EN. To change: edit voice_config.yaml → time_format. Or say 'Use 24-hour time' / 'Use 12-hour time'."
      ru: "По умолчанию: 24ч для RU/UK, 12ч для EN. Изменить: voice_config.yaml → time_format. Или скажите 'Используй 24-часовой формат'."
      uk: "За замовчуванням: 24г для RU/UK, 12г для EN. Змінити: voice_config.yaml → time_format. Або скажіть 'Використовуй 24-годинний формат'."
