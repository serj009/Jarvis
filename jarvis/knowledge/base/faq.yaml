      ru: "Можно ли играть + JARVIS?"
      uk: "Чи можна грати + JARVIS?"
    answer:
      en: "Yes! Gaming mode: LLM on CPU, TTS on CPU, GPU 100% for game. Response up to 20 sec but you hear 'Checking now' immediately. Activates automatically when a game is detected."
      ru: "Да! Игровой режим: LLM на CPU, TTS на CPU, GPU на 100% для игры. Ответ до 20 сек, но сразу услышите 'Сейчас проверю'. Активируется автоматически при обнаружении игры."
      uk: "Так! Ігровий режим: LLM на CPU, TTS на CPU, GPU на 100% для гри. Відповідь до 20 сек, але одразу почуєте 'Зараз перевірю'. Активується автоматично при виявленні гри."
    tags: ["gaming", "performance"]

  - question:
      en: "How do I speed up JARVIS?"
      ru: "Как ускорить JARVIS?"
      uk: "Як прискорити JARVIS?"
    answer:
      en: "Options: 1) Increase OLLAMA_KEEP_ALIVE (keep model in GPU longer). 2) Use Qwen3-4B instead of 8B (faster, less quality). 3) Close background apps to free VRAM. 4) Use headphones (skip AEC processing). 5) Response cache auto-speeds repeated commands."
      ru: "Варианты: 1) Увеличить OLLAMA_KEEP_ALIVE (держать модель в GPU дольше). 2) Использовать Qwen3-4B вместо 8B (быстрее, чуть хуже качество). 3) Закрыть фоновые приложения для освобождения VRAM. 4) Наушники (пропустить AEC). 5) Кэш ответов автоматически ускоряет повторные команды."
      uk: "Варіанти: 1) Збільшити OLLAMA_KEEP_ALIVE (тримати модель в GPU довше). 2) Використовувати Qwen3-4B замість 8B (швидше, трохи гірша якість). 3) Закрити фонові програми для звільнення VRAM. 4) Навушники (пропустити AEC). 5) Кеш відповідей автоматично прискорює повторні команди."
    tags: ["performance", "optimization"]

  - question:
      en: "How much VRAM does JARVIS use?"
      ru: "Сколько VRAM использует JARVIS?"
      uk: "Скільки VRAM використовує JARVIS?"
    answer:
      en: "LLM (Qwen3-8B Q4): ~5-8 GB. Whisper STT: 0 (CPU). Piper TTS: 0 (CPU). Total active: ~5-8 GB. Check real usage: say 'status' or run nvidia-smi."
      ru: "LLM (Qwen3-8B Q4): ~5-8 ГБ. Whisper STT: 0 (CPU). Piper TTS: 0 (CPU). Итого: ~5-8 ГБ. Проверить реальное: скажите 'статус' или запустите nvidia-smi."
      uk: "LLM (Qwen3-8B Q4): ~5-8 ГБ. Whisper STT: 0 (CPU). Piper TTS: 0 (CPU). Разом: ~5-8 ГБ. Перевірити реальне: скажіть 'стан' або запустіть nvidia-smi."
    tags: ["performance", "vram"]

  - question:
      en: "Can I run JARVIS on a weaker PC?"
      ru: "Можно ли на слабом ПК?"
      uk: "Чи можна на слабкому ПК?"
    answer:
      en: "Minimum: NVIDIA GPU with 6+ GB VRAM, 16 GB RAM. For 4-6 GB VRAM use Qwen3-4B instead of 8B. Without GPU: everything on CPU (very slow, 10-30 sec per response, but works). Piper TTS and Whisper STT work fine on CPU."
      ru: "Минимум: NVIDIA GPU с 6+ ГБ VRAM, 16 ГБ RAM. Для 4-6 ГБ VRAM используйте Qwen3-4B вместо 8B. Без GPU: всё на CPU (очень медленно, 10-30 сек на ответ, но работает). Piper TTS и Whisper STT нормально работают на CPU."
      uk: "Мінімум: NVIDIA GPU з 6+ ГБ VRAM, 16 ГБ RAM. Для 4-6 ГБ VRAM використовуйте Qwen3-4B замість 8B. Без GPU: все на CPU (дуже повільно, 10-30 сек на відповідь, але працює). Piper TTS і Whisper STT нормально працюють на CPU."
    tags: ["performance", "hardware"]

  - question:
      en: "JARVIS freezes / hangs"
      ru: "JARVIS тормозит / зависает"
      uk: "JARVIS гальмує / зависає"
    answer:
      en: "1) Check VRAM: say 'status' or run nvidia-smi. 2) Close GPU-heavy apps. 3) If completely frozen: Ctrl+C in terminal, restart. 4) Check logs/ folder for errors. 5) If happens often: reduce model size or increase VRAM budget."
      ru: "1) Проверьте VRAM: скажите 'статус' или запустите nvidia-smi. 2) Закройте GPU-тяжёлые приложения. 3) Если полностью завис: Ctrl+C в терминале, перезапустите. 4) Проверьте папку logs/ на ошибки. 5) Если часто: уменьшите модель или увеличьте VRAM бюджет."
      uk: "1) Перевірте VRAM: скажіть 'стан' або запустіть nvidia-smi. 2) Закрийте GPU-важкі програми. 3) Якщо повністю завис: Ctrl+C в терміналі, перезапустіть. 4) Перевірте папку logs/ на помилки. 5) Якщо часто: зменшіть модель або збільшіть VRAM бюджет."
    tags: ["performance", "troubleshooting"]

