      ru: "Выполните 'git pull' в папке проекта. Ваша личная память (memory/) не затрагивается — она в .gitignore. После pull: проверьте логи, запустите smoke-test, перезапустите JARVIS."
      uk: "Виконайте 'git pull' в папці проекту. Ваша особиста пам'ять (memory/) не зачіпається — вона в .gitignore. Після pull: перевірте логи, запустіть smoke-test, перезапустіть JARVIS."
    tags: ["config", "update"]

