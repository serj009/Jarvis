      ru: "Скажите 'Обращайся ко мне [обращение]' или измените в настройках: set_preference('address', 'шеф'). По умолчанию 'сэр'."
      uk: "Скажіть 'Звертайся до мене [звертання]' або змініть в налаштуваннях: set_preference('address', 'шефе'). За замовчуванням 'сер'."
