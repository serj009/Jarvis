      ru: "JARVIS не запускается"
      uk: "JARVIS не запускається"
    answer:
      en: "Check: 1) Ollama is running (ollama serve). 2) Model is downloaded (ollama list). 3) Python venv is activated. 4) Run smoke_test.py to diagnose. 5) Check logs/ for errors."
      ru: "Проверьте: 1) Ollama запущена (ollama serve). 2) Модель скачана (ollama list). 3) Python venv активирован. 4) Запустите smoke_test.py для диагностики. 5) Проверьте logs/ на ошибки."
      uk: "Перевірте: 1) Ollama запущена (ollama serve). 2) Модель завантажена (ollama list). 3) Python venv активовано. 4) Запустіть smoke_test.py для діагностики. 5) Перевірте logs/ на помилки."
    tags: ["troubleshooting", "startup"]

  - question:
      en: "JARVIS is frozen, what do I do?"
      ru: "JARVIS завис, что делать?"
      uk: "JARVIS завис, що робити?"
    answer:
      en: "1) Press Ctrl+C in terminal. 2) If no response — close terminal window. 3) Check nvidia-smi for GPU state. 4) Restart: python jarvis.py. 5) All memory is safe — nothing lost on crash."
      ru: "1) Нажмите Ctrl+C в терминале. 2) Если не реагирует — закройте окно терминала. 3) Проверьте nvidia-smi состояние GPU. 4) Перезапустите: python jarvis.py. 5) Вся память в безопасности — ничего не теряется при падении."
      uk: "1) Натисніть Ctrl+C в терміналі. 2) Якщо не реагує — закрийте вікно терміналу. 3) Перевірте nvidia-smi стан GPU. 4) Перезапустіть: python jarvis.py. 5) Вся пам'ять в безпеці — нічого не втрачається при падінні."
    tags: ["troubleshooting", "crash"]

  - question:
      en: "CUDA / GPU error"
      ru: "Ошибка CUDA / GPU"
      uk: "Помилка CUDA / GPU"
    answer:
      en: "Common causes: 1) Out of VRAM — close GPU-heavy apps, reduce model size. 2) CUDA version mismatch — reinstall PyTorch matching your CUDA. 3) Driver needs update — download latest from nvidia.com. 4) GPU overheating — check temperature in nvidia-smi."
      ru: "Частые причины: 1) Нехватка VRAM — закройте GPU-тяжёлые приложения, уменьшите модель. 2) Несовпадение версии CUDA — переустановите PyTorch под вашу CUDA. 3) Драйвер устарел — скачайте последний с nvidia.com. 4) Перегрев GPU — проверьте температуру в nvidia-smi."
      uk: "Часті причини: 1) Нестача VRAM — закрийте GPU-важкі програми, зменшіть модель. 2) Невідповідність версії CUDA — перевстановіть PyTorch під вашу CUDA. 3) Драйвер застарів — завантажте останній з nvidia.com. 4) Перегрів GPU — перевірте температуру в nvidia-smi."
    tags: ["troubleshooting", "gpu", "cuda"]

  - question:
      en: "Ollama not responding"
      ru: "Ollama не отвечает"
      uk: "Ollama не відповідає"
    answer:
      en: "1) Check if running: curl http://127.0.0.1:11434/api/tags. 2) Restart: ollama serve. 3) Check if model is downloaded: ollama list. 4) Port conflict: another app may use 11434. 5) Firewall may block — add exception."
      ru: "1) Проверить запущена ли: curl http://127.0.0.1:11434/api/tags. 2) Перезапустить: ollama serve. 3) Проверить модель: ollama list. 4) Конфликт порта: другое приложение может использовать 11434. 5) Файрвол может блокировать — добавьте исключение."
      uk: "1) Перевірити чи запущена: curl http://127.0.0.1:11434/api/tags. 2) Перезапустити: ollama serve. 3) Перевірити модель: ollama list. 4) Конфлікт порту: інша програма може використовувати 11434. 5) Файрвол може блокувати — додайте виключення."
    tags: ["troubleshooting", "ollama"]

  - question:
      en: "No sound / can't hear JARVIS"
      ru: "Нет звука / не слышу JARVIS"
      uk: "Немає звуку / не чую JARVIS"
    answer:
      en: "Check: 1) Windows volume is not muted. 2) Correct audio output device selected. 3) Piper TTS models are downloaded (check models/piper/). 4) Run test: python -c 'from piper import PiperVoice; print(\"OK\")'. 5) Check logs for TTS errors."
      ru: "Проверьте: 1) Громкость Windows не на нуле. 2) Правильное устройство вывода выбрано. 3) Модели Piper TTS скачаны (проверьте models/piper/). 4) Тест: python -c 'from piper import PiperVoice; print(\"OK\")'. 5) Проверьте логи на ошибки TTS."
      uk: "Перевірте: 1) Гучність Windows не на нулі. 2) Правильний пристрій виводу обрано. 3) Моделі Piper TTS завантажені (перевірте models/piper/). 4) Тест: python -c 'from piper import PiperVoice; print(\"OK\")'. 5) Перевірте логи на помилки TTS."
    tags: ["troubleshooting", "audio", "tts"]

  - question:
      en: "Whisper recognizes garbage / noise"
      ru: "Whisper распознаёт мусор"
      uk: "Whisper розпізнає сміття"
    answer:
      en: "1) Increase VAD threshold in voice_config.yaml (default 0.5, try 0.6-0.7). 2) Reduce background noise. 3) Check mic isn't picking up fans/AC. 4) STT confidence checker auto-ignores low-confidence results. 5) Use a directional mic or headset."
      ru: "1) Увеличьте порог VAD в voice_config.yaml (по умолчанию 0.5, попробуйте 0.6-0.7). 2) Уберите фоновый шум. 3) Проверьте что микрофон не ловит вентиляторы/кондиционер. 4) Проверка уверенности STT автоматически игнорирует мусор. 5) Используйте направленный микрофон или гарнитуру."
      uk: "1) Збільшіть поріг VAD в voice_config.yaml (за замовчуванням 0.5, спробуйте 0.6-0.7). 2) Приберіть фоновий шум. 3) Перевірте що мікрофон не ловить вентилятори/кондиціонер. 4) Перевірка впевненості STT автоматично ігнорує сміття. 5) Використовуйте спрямований мікрофон або гарнітуру."
    tags: ["troubleshooting", "stt", "noise"]
