  - question:
      en: "Where does my data go?"
      ru: "Куда уходят мои данные?"
      uk: "Куди йдуть мої дані?"
    answer:
      en: "Nowhere. Everything stays on your PC. JARVIS is 100% local — no cloud, no telemetry, no analytics. Your conversations and facts are in SQLite files in the memory/ folder. Only web search sends queries to the internet (when you explicitly ask to search)."
      ru: "Никуда. Всё остаётся на вашем ПК. JARVIS полностью локальный — без облака, телеметрии, аналитики. Ваши диалоги и факты в SQLite файлах в папке memory/. Только веб-поиск отправляет запросы в интернет (когда вы явно просите искать)."
      uk: "Нікуди. Все залишається на вашому ПК. JARVIS повністю локальний — без хмари, телеметрії, аналітики. Ваші діалоги та факти в SQLite файлах в папці memory/. Тільки веб-пошук надсилає запити в інтернет (коли ви явно просите шукати)."
    tags: ["privacy", "data"]

  - question:
      en: "Does JARVIS work without internet?"
      ru: "Работает ли без интернета?"
      uk: "Чи працює без інтернету?"
    answer:
      en: "Yes, core functions work fully offline: voice commands, opening programs, memory, status. Web search and browser features require internet. JARVIS tells you when a feature needs connectivity."
      ru: "Да, основные функции полностью офлайн: голосовые команды, открытие программ, память, статус. Веб-поиск и браузер требуют интернета. JARVIS скажет если функция требует подключения."
      uk: "Так, основні функції повністю офлайн: голосові команди, відкриття програм, пам'ять, статус. Веб-пошук і браузер потребують інтернету. JARVIS скаже якщо функція потребує підключення."
    tags: ["offline", "basics"]

  - question:
      en: "How do I delete all my data?"
      ru: "Как удалить все данные?"
      uk: "Як видалити всі дані?"
    answer:
      en: "Delete the memory/ folder. This removes all personal facts, preferences, and conversation history. Knowledge (knowledge/ folder) is shared and doesn't contain personal data."
      ru: "Удалите папку memory/. Это удалит все личные факты, предпочтения и историю диалогов. Знания (папка knowledge/) — общие и не содержат личных данных."
      uk: "Видаліть папку memory/. Це видалить всі особисті факти, уподобання та історію діалогів. Знання (папка knowledge/) — спільні і не містять особистих даних."
    tags: ["privacy", "data", "delete"]

  - question:
      en: "Antivirus blocks JARVIS"
      ru: "Антивирус блокирует JARVIS"
      uk: "Антивірус блокує JARVIS"
    answer:
      en: "Add the JARVIS project folder to Windows Defender exclusions. Do NOT exclude python.exe globally — only the project folder. In PowerShell (admin): Add-MpPreference -ExclusionPath 'C:\\path\\to\\Jarvis'"
      ru: "Добавьте папку проекта JARVIS в исключения Windows Defender. НЕ исключайте python.exe глобально — только папку проекта. В PowerShell (админ): Add-MpPreference -ExclusionPath 'C:\\путь\\к\\Jarvis'"
      uk: "Додайте папку проекту JARVIS до виключень Windows Defender. НЕ виключайте python.exe глобально — тільки папку проекту. В PowerShell (адмін): Add-MpPreference -ExclusionPath 'C:\\шлях\\до\\Jarvis'"
    tags: ["safety", "antivirus", "troubleshooting"]

