# ════════════════════════════════════════════════════
# 📅 РАБОЧИЙ ГРАФИК (шаблон)
# ════════════════════════════════════════════════════
# JARVIS может учитывать это для:
# - Не будить голосом когда спит после ночной
# - Знать когда пользователь дома / на работе
# - Переключать режимы (low_power когда на работе)

work_schedule:
  type: "shift"                   # Сменный график
  rotation: "monthly"             # Чередование каждый месяц
  shifts:
    day:
      days: ["wed", "thu", "fri", "sat"]  # Обычно ср-сб, может меняться
      hours: "10.5h"
      commute: "1.5h one way"
    night:
      days: ["wed", "thu", "fri", "sat"]
      hours: "10.5h"
      commute: "1.5h one way"
  note: "График может меняться — обновлять ежемесячно"
