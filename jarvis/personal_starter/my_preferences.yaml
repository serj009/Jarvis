# ════════════════════════════════════════════════════
# ⚙️ НАСТРОЙКИ
# ════════════════════════════════════════════════════

preferences:
  language: "auto"              # Автоопределение UA/RU/EN
  response_style: "concise"     # Краткие ответы
  address: "sir"                # Обращение "сэр" / "сер" / "sir"
  time_format_ru: "24h"
  time_format_uk: "24h"
  time_format_en: "12h"
  gaming_mode: "auto"           # Автоопределение по процессу
  announce_actions: true        # Говорить "Открываю X"
  tts_volume: "loud"            # Громкость TTS: quiet / normal / loud
  browser: "chrome"             # Основной браузер — Google Chrome

# ════════════════════════════════════════════════════
# 👤 ФАКТЫ О ПОЛЬЗОВАТЕЛЕ
